<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healverse</title>
    <link rel="icon" type="image/png" href="../catpixel.png">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--bg);
            color: var(--text);
            transition: background 0.3s ease, color 0.3s ease;
        }

        .box {
            --b: 4px;   
            --c: red;  
            --w: 15px; 
            

            border: var(--b) solid #0000; 
            --_g: #0000 90deg,var(--c) 0;
            --_p: var(--w) var(--w) border-box no-repeat;
            background:
                conic-gradient(from 90deg  at top    var(--b) left  var(--b),var(--_g)) 0    0    / var(--_p),
                conic-gradient(from 180deg at top    var(--b) right var(--b),var(--_g)) 100% 0    / var(--_p),
                conic-gradient(from 0deg   at bottom var(--b) left  var(--b),var(--_g)) 0    100% / var(--_p),
                conic-gradient(from -90deg at bottom var(--b) right var(--b),var(--_g)) 100% 100% / var(--_p);
            
            width:500px;
            height:100px;
            box-sizing:border-box;
            margin: 0 0 40px 0;
            display:inline-flex;
            font-size:30px;
            justify-content:center;
            align-items:center;
            text-align:center;
            transform-origin: center center;
            margin-top: 20px;
        }

        a {
            text-decoration: none;
            color: var(--text);
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="box" style="--c:black;">
        <p>Healverse</p>
    </div>

    <br>
    <a href="ch/1.html" class="box" style="--c:black; width: 200px; color: black; height: 50px; margin: 15px;">Prologue</a>
    <a href="ch/2.html" class="box" style="--c:black; width: 200px; color: black; height: 50px; margin: 0px;">Chapter 1</a>

</body>
</html>
